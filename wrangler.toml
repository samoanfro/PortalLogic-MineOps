name = "mineops-production"
main = "api/worker.js"
compatibility_date = "2026-10-01"
assets = { directory = ".", binding = "ASSETS" }

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "mineops-production"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "mineops-evidence"
